name: 01-Building-Blocks
on: push
jobs:
  echo-hello:
    runs-on: ubuntu-latest
    steps:
    - name: Say hello
      run: echo "Hello, World! the trigger is ${{ github.event_name }} event!"
  echo-goodbye:
    runs-on: ubuntu-latest
    steps:
    - name: Successful step
      run: |
        echo "Program succeeded!"
        exit 0
    - name: Say goodbye
      run: echo "Goodbye, world!"
